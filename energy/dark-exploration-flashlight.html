<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>黑暗探索手電筒 (沈浸式最終版)</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden; 
            touch-action: none; 
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            /* 隱藏滑鼠游標以增加沉浸感 */
            cursor: none;
        }

        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 背景圖 */
            background-image: url('https://zfangzfang.github.io/sun-role-cer/images/flashlight.png'); 
            background-size: cover;
            background-position: center;
            z-index: 1;
        }

        #darkness-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: auto; /* 讓 Canvas 接收觸控 */
        }

        #instruction-text {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            background-color: rgba(0, 0, 0, 0.5); /* 改回黑色半透明，比較不突兀 */
            padding: 10px 24px;
            border-radius: 30px;
            font-family: sans-serif;
            font-size: 16px;
            z-index: 20;
            pointer-events: none;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
            white-space: nowrap;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="background-layer"></div>
        <canvas id="darkness-canvas"></canvas>
        
        <div id="instruction-text">
            請移動滑鼠或手指頭進行探索
        </div>
    </div>

    <script>
        (function() {
            const container = document.getElementById('game-container');
            const canvas = document.getElementById('darkness-canvas');
            const ctx = canvas.getContext('2d');
            
            let width = window.innerWidth;
            let height = window.innerHeight;
            
            // 初始座標 (熄燈狀態)
            let lightX = -5000;
            let lightY = -5000;
            
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const radius = isMobile ? 180 : 150; 

            // --- 核心邏輯 ---
            function updateLight(x, y) {
                lightX = x;
                lightY = y;
            }

            function lightOff() {
                lightX = -5000;
                lightY = -5000;
            }

            // --- 繪圖迴圈 ---
            function draw() {
                ctx.clearRect(0, 0, width, height);

                // 1. 塗黑
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, width, height);

                // 2. 只有在開啟時才挖洞
                if (lightX > -2000) {
                    ctx.globalCompositeOperation = 'destination-out';

                    const gradient = ctx.createRadialGradient(lightX, lightY, 0, lightX, lightY, radius);
                    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); 
                    gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.5)');
                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(lightX, lightY, radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.globalCompositeOperation = 'source-over';
                }

                requestAnimationFrame(draw);
            }

            // --- 事件監聽 ---
            
            // 處理觸控 (Touch)
            function handleTouch(e) {
                // 只有在觸控發生在 canvas 上時，才防止預設行為
                // 這樣可以避免影響瀏覽器邊緣的手勢操作
                if (e.cancelable) {
                    e.preventDefault();
                }
                
                if (e.touches && e.touches.length > 0) {
                    const touch = e.touches[0];
                    updateLight(touch.clientX, touch.clientY);
                } else {
                    lightOff();
                }
            }

            const touchOptions = { passive: false };

            container.addEventListener('touchstart', handleTouch, touchOptions);
            container.addEventListener('touchmove', handleTouch, touchOptions);
            container.addEventListener('touchend', lightOff, touchOptions);
            container.addEventListener('touchcancel', lightOff, touchOptions);

            // 滑鼠處理
            container.addEventListener('mousemove', function(e) {
                updateLight(e.clientX, e.clientY);
            });
            container.addEventListener('mouseleave', lightOff);

            // 視窗大小改變
            window.addEventListener('resize', function() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            });

            // 啟動
            canvas.width = width;
            canvas.height = height;
            draw();

        })();
    </script>
</body>
</html>
